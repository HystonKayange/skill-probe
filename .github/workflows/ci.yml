# Unit tests + typecheck + build on every push/PR. Zero API calls, zero secrets — the statistical core
# and all command logic are tested against mock adapters and real captured runtime output (fixtures).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: build + smoke the compiled CLI (what npm users run)
        # no runtime CLI on the runner (doctor would rightly fail) — check the build itself
        run: |
          npm run build
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          node --input-type=module -e '
            import { readdirSync } from "node:fs";
            for (const dir of ["dist", "dist/adapters"])
              for (const f of readdirSync(dir))
                if (f.endsWith(".js") && f !== "cli.js") await import(`./${dir}/${f}`);
            console.log("all compiled modules load");'
          set +e; node dist/cli.js --config examples/audit.config.json --runtime nope > out.txt 2>&1; code=$?; set -e
          test "$code" = 2 && grep -q "unknown runtime 'nope'" out.txt
